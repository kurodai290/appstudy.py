<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ワクワク学習ポータル | 小学生・中学生の勉強ルーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🎒 ワクワク学習ポータル</h1>
        <p>小学校から中学生まで使える！毎日の勉強を楽しく応援するサイト</p>
    </header>

    <div class="container">

        <!-- 小学生向けセクション -->
        <h2 class="section-title">🏫 小学生の学習ルーム（基礎中心）</h2>
        <div class="grid">
            
            <div class="card">
                <div class="card-header shou-sansu">📘 算数（さんすう）</div>
                <div class="card-body">
                    <ul>
                        <!-- quiz.htmlに学年と教科の情報を送るリンク -->
                        <li><a href="quiz.html?grade=shou&subject=sansu">たし算・ひき算クイズ <span class="arrow">▶</span></a></li>
                    </ul>
                </div>
            </div>

        </div>

        <!-- 中学生向けセクション -->
        <h2 class="section-title">✍ 中学生の学習ルーム（基礎 ➔ 応用）</h2>
        <div class="grid">
            
            <div class="card">
                <div class="card-header chu-suugaku">🟣 数学 (Math)</div>
                <div class="card-body">
                    <ul>
                        <!-- quiz.htmlに学年と教科の情報を送るリンク -->
                        <li><a href="quiz.html?grade=chu&subject=suugaku">正の数・負の数計算 <span class="arrow">▶</span></a></li>
                    </ul>
                </div>
            </div>

        </div>

    </div>

    <footer>
        <p>© 2026 ワクワク学習ポータル. みんなの学びを応援しています！</p>
    </footer>

</body>
</html>
