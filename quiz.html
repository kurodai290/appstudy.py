<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クイズに挑戦！ | ワクワク学習ポータル</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 id="quiz-title">クイズ画面</h1>
        <p id="quiz-subtitle">全問正解をめざしてがんばろう！</p>
    </header>

    <div class="container">
        <!-- ⏱ タイマー表示 -->
        <div id="timer-display" class="timer-box">タイム: 0秒</div>

        <div class="quiz-container">
            <div class="quiz-progress">
                <span id="level-badge" class="badge">ステージ</span>
                <span id="question-number">第 1 問</span>
            </div>

            <div id="question-text" class="question-box">問題を読み込んでいます...</div>

            <div id="choices-container" class="choices-grid"></div>

            <div id="result-message" class="result-box hide">
                <p id="feedback-text"></p>
                <button id="next-btn" class="btn">次の問題へ</button>
            </div>

            <!-- 🏆 【新設】ランキング登録・表示エリア -->
            <div id="ranking-section" class="ranking-box hide">
                <h2>🏆 歴代ハイスコアランキング</h2>
                
                <!-- 名前入力フォーム -->
                <div id="register-score-zone">
                    <p>ランクイン達成！名前を入力して記録を残そう：</p>
                    <input type="text" id="player-name-input" placeholder="なまえ（5文字まで）" maxlength="5">
                    <button id="save-score-btn" class="btn">ランキングに登録</button>
                </div>

                <!-- ランキング順位表 -->
                <table class="ranking-table">
                    <thead>
                        <tr>
                            <th>順位</th>
                            <th>なまえ</th>
                            <th>正解数</th>
                            <th>タイム</th>
                        </tr>
                    </thead>
                    <tbody id="ranking-table-body">
                        <!-- ここにJavaScriptで順位が並びます -->
                    </tbody>
                </table>
            </div>

        </div>

        <div style="text-align: center; margin-top: 20px;">
            <a href="index.html" class="back-link">⬅ トップページにもどる</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const fileName = urlParams.get('file') || 'data_shou1';
        
        const dataScript = document.createElement('script');
        dataScript.src = `data/${fileName}.js`;
        document.body.appendChild(dataScript);

        dataScript.onload = () => {
            const engineScript = document.createElement('script');
            engineScript.src = 'quiz_engine.js';
            document.body.appendChild(engineScript);
        };
    </script>
</body>
</html>
