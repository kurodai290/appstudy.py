<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クイズに挑戦！ | ワクワク学習ポータル</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1 id="quiz-title">クイズ画面</h1>
        <p id="quiz-subtitle">全問正解をめざしてがんばろう！</p>
    </header>

    <div class="container">
        <div class="quiz-container">
            <div class="quiz-progress">
                <span id="level-badge" class="badge">ステージ</span>
                <span id="question-number">第 1 問</span>
            </div>

            <div id="question-text" class="question-box">問題を読み込んでいます...</div>

            <div id="choices-container" class="choices-grid"></div>

            <div id="result-message" class="result-box hide">
                <p id="feedback-text"></p>
                <button id="next-btn" class="btn">次の問題へ</button>
            </div>
        </div>

        <div style="text-align: center; margin-top: 20px;">
            <a href="index.html" class="back-link">⬅ トップページにもどる</a>
        </div>
    </div>

    <!-- ２つのJSファイルを順番に読み込む -->
    <script src="quiz_data.js"></script>
    <script src="quiz_engine.js"></script>
</body>
</html>
